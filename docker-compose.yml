# Сайт + PostgreSQL на одном VPS:  docker compose up -d --build
services:
  app:
    build: .
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgres://prostranstvo:${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}@db:5432/prostranstvo
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: prostranstvo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: prostranstvo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prostranstvo"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
